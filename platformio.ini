; MeshCore Hub - ESP32 gateway between a MeshCore Companion radio, Telegram and a web app.
;
;   pio run -e t-display-s3                   build firmware
;   pio run -e t-display-s3 -t uploadfs       build web app (tools/build_web.py) + flash LittleFS
;   pio run -e t-display-s3 -t upload         flash firmware
;   pio test -e native                        host unit tests (needs gcc/g++ in PATH)

[platformio]
default_envs = t-display-s3
data_dir = data

[env]
; pioarduino: Arduino-ESP32 3.3.11 on ESP-IDF 5.5 (needed for the PPP / 4G modem support).
; The 4 MB boards stay on Arduino 2 (see [arduino2]).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions/4mb_ota_fs.csv
extra_scripts = pre:tools/pio_prebuild.py
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2
  esp32async/ESPAsyncWebServer@3.12.1
  esp32async/AsyncTCP@3.5.0
  bblanchon/ArduinoJson@7.4.3
build_unflags = -std=gnu++11
build_src_flags = -Wall -Wextra -Wno-missing-field-initializers
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
  -DHUB_VERSION=\"1.1.7\"
  ; NimBLE: we are a central only
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
  ; AsyncWebServer / AsyncTCP tuning
  -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
  -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -DWS_MAX_QUEUED_MESSAGES=24

; Arduino-ESP32 2.0.17 for the 4 MB boards: the Arduino 3 firmware does not fit their
; 1.625 MB OTA slots. No 4G there (PPP needs ESP-IDF 5).
[arduino2]
platform = espressif32@6.12.0
; Arduino 2 ships Bluedroid, so NimBLE takes its pool sizes from here (Arduino 3 sets it in sdkconfig).
build_flags = ${env.build_flags} -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; ESP32-S3 DevKitC-1 (8 MB flash). RGB LED on GPIO48.
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = partitions/8mb_ota_fs.csv
build_flags = ${env.build_flags} -DSTATUS_LED_PIN=48 -DSTATUS_LED_RGB=1 -DBOOT_BUTTON_PIN=0

; ESP32-S3 N16R8 boards: 16 MB flash, 8 MB octal PSRAM (allocations > 4 kB go to PSRAM),
; logs and flashing on the native USB port. No status LED: on display boards (T-Display-S3)
; GPIO48 is a data line of the screen.
[env:esp32-s3-n16r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/16mb_ota_fs.csv
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOOT_BUTTON_PIN=0
; Arduino 3 keeps the Wi-Fi/lwIP and TLS buffers in internal RAM: with 8 MB of PSRAM next to
; it, moving them out leaves the internal RAM to BLE, the web server and the tasks (and lets
; Telegram keep its sessions open). For the 4G modem, LCP echo lets lwIP notice a PPP peer that
; went silent (modem restarted, session dropped). pioarduino rebuilds the ESP-IDF libraries for
; this: the first build takes a while, and the project path must not contain spaces.
; (No comment lines inside custom_sdkconfig: pioarduino drops what follows them.)
custom_sdkconfig =
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  CONFIG_LWIP_ENABLE_LCP_ECHO=y
  CONFIG_LWIP_LCP_ECHOINTERVAL=30
  CONFIG_LWIP_LCP_MAXECHOFAILS=3

; LilyGO T-Display-S3 (N16R8 + 1.9" 170x320 ST7789 on an 8-bit parallel bus): status screen.
; Buttons: BOOT (GPIO0, held 5 s = setup wizard) and KEY (GPIO14, next screen page).
[env:t-display-s3]
extends = env:esp32-s3-n16r8
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.2.33
; 4G modem on the free header pins 43/44 (the console is on the native USB port).
build_flags = ${env:esp32-s3-n16r8.build_flags} -DHUB_DISPLAY_TDISPLAY_S3 -DDISPLAY_BUTTON_PIN=14
  -DCELL_DEFAULT_TX=43 -DCELL_DEFAULT_RX=44

; ESP32-S3 boards with 4 MB flash (S3 Super Mini, XIAO S3...).
[env:esp32-s3-4mb]
platform = ${arduino2.platform}
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = ${arduino2.build_flags} -DBOOT_BUTTON_PIN=0

; ESP32-C3 DevKitM-1 (4 MB). RGB LED on GPIO8, BOOT button on GPIO9.
[env:esp32-c3-devkitm-1]
platform = ${arduino2.platform}
board = esp32-c3-devkitm-1
build_flags = ${arduino2.build_flags} -DSTATUS_LED_PIN=8 -DSTATUS_LED_RGB=1 -DBOOT_BUTTON_PIN=9

; Host unit tests of the protocol layer (no Arduino).
[env:native]
platform = native
framework =
extra_scripts =
lib_deps =
build_flags = -std=gnu++17 -Wall
build_src_filter = -<*> +<protocol/> +<core/>
test_build_src = yes
